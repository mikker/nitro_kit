name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails test

  system:
    name: Browser smoke
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git pkg-config google-chrome-stable xvfb
          if command -v chromedriver; then sudo rm "$(command -v chromedriver)"; fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run system tests
        env:
          HEADLESS: "false"
          RAILS_ENV: test
        run: xvfb-run --auto-servernum bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/test/dummy/tmp/capybara
          if-no-files-found: ignore

  deploy:
    name: Deploy gallery
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, system]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    concurrency:
      group: gallery-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Install SSH private key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Add host to SSH known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan "${{ secrets.DOKKU_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_SERVER_HOST }}
          DOKKU_APP: nk-gallery
        run: bin/deploy-gallery
