name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails test

  system:
    name: Browser smoke (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git pkg-config google-chrome-stable xvfb
          if command -v chromedriver; then sudo rm "$(command -v chromedriver)"; fi

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Chrome system tests
        if: matrix.browser == 'chrome'
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "false"
          RAILS_ENV: test
        run: xvfb-run --auto-servernum bin/rails test:system

      - name: Run Firefox priority smoke tests
        if: matrix.browser == 'firefox'
        env:
          BROWSER: firefox
          HEADLESS: "false"
          RAILS_ENV: test
        run: xvfb-run --auto-servernum bin/browser-smoke

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/test/dummy/tmp/capybara
          if-no-files-found: ignore

  safari:
    name: Browser smoke (Safari)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Enable Safari automation
        run: sudo -n safaridriver --enable
      - name: Run system tests
        env:
          BROWSER: safari
          HEADLESS: "false"
          PARALLEL_WORKERS: "1"
          RAILS_ENV: test
        run: bin/browser-smoke
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: safari-screenshots
          path: ${{ github.workspace }}/test/dummy/tmp/capybara
          if-no-files-found: ignore

  deploy:
    name: Deploy gallery
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, system, safari]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    concurrency:
      group: gallery-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Set up SSH
        uses: brnbw/actions/setup-ssh@eaef61d361491dfe22dec075718bb91779540d2a # v1.0.0
        with:
          private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DOKKU_SSH_KNOWN_HOSTS }}

      - name: Deploy
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_SERVER_HOST }}
          DOKKU_APP: nk-gallery
        run: git push "dokku@${DOKKU_HOST}:${DOKKU_APP}" HEAD:main
